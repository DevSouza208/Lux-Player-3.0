name: Publish Lux Player frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lux-frontend-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Enable Yarn 1
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Install frontend
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive
      - name: Build React/Vite for Pages
        working-directory: frontend
        env:
          GITHUB_PAGES: 'true'
        run: yarn build
      - name: Support SPA routes
        run: |
          cp frontend/dist/index.html frontend/dist/404.html
          touch frontend/dist/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist
      - name: Deploy built site
        id: deployment
        uses: actions/deploy-pages@v4
